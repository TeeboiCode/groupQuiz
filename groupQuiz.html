<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title> Group Challenge</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar">
      <div class="nav-logo">
        <a href="index.html">
          <img src="./assests/download.png" alt="App Logo" />
        </a>
        <span> Group Challenge</span>
      </div>
      <a href="scoreboard.html" class="scoreboard-btn">🏆 Scoreboard</a>
    </nav>

    <div class="container">
      <!-- Header -->
      <div class="header">
        <h1>Pick a Challenges</h1>
        <div class="question-tracker">
          Current Challenge:
          <strong id="current-question-number">None</strong>
        </div>
      </div>

      <!-- Question Grid -->
      <div id="load-status" class="load-status">
        <div role="status" aria-live="polite">
          <h2 id="load-title">Loading challenges...</h2>
          <p id="load-message">Your next challenge is on its way.</p>
        </div>
        <button id="retry-load" type="button" hidden>Try again</button>
        <a id="load-home" href="index.html" hidden>Back to home</a>
      </div>
      <div class="question-grid" id="question-grid"></div>

      <!-- Question Box -->
      <div class="question-box" id="question-box" style="display: none">
        <h2 id="question-text"></h2>
        <p class="countdown-label">
          Time Remaining: <span id="countdown">60</span> seconds
        </p>
        <button id="pass-to-bonus">⏭ Pass to Bonus</button>
        <button id="back-to-grid" class="back-btn">
          🔙 Back to Challenges
        </button>
      </div>

      <!-- Preloader Countdown -->
      <div class="preloader-overlay" id="preloader" style="display: none">
        <div class="preloader-content">
          <p id="preloader-count">3</p>
          <p>Get Ready...</p>
        </div>
      </div>
    </div>

    <!-- Scripts -->
    <script>
      const grid = document.getElementById("question-grid");
      const questionBox = document.getElementById("question-box");
      const questionText = document.getElementById("question-text");
      const countdown = document.getElementById("countdown");
      const questionNumberEl = document.getElementById(
        "current-question-number"
      );
      const passBtn = document.getElementById("pass-to-bonus");
      const backBtn = document.getElementById("back-to-grid");

      let usedNumbers = new Set();
      let timer;
      let questionData = [];

      const loadStatus = document.getElementById("load-status");
      const loadTitle = document.getElementById("load-title");
      const loadMessage = document.getElementById("load-message");
      const retryLoad = document.getElementById("retry-load");
      const loadHome = document.getElementById("load-home");

      function showLoadError(message, canRetry) {
        loadTitle.textContent = "Challenges are unavailable";
        loadMessage.textContent = message;
        retryLoad.hidden = !canRetry;
        loadHome.hidden = false;
      }

      async function loadQuestions() {
        loadStatus.hidden = false;
        loadTitle.textContent = "Loading challenges...";
        loadMessage.textContent = "Your next challenge is on its way.";
        retryLoad.hidden = true;
        loadHome.hidden = true;
        if (window.location.protocol === "file:") {
          showLoadError("Please use the quiz website link shared by your host to play.", false);
          return;
        }

        try {
          const res = await fetch("./db.json");
          if (!res.ok) {
            throw new Error(`Unable to load db.json (HTTP ${res.status}).`);
          }
          const data = await res.json();
          if (!Array.isArray(data.questions) || !data.questions.length ||
              !data.questions.every((item) => item && typeof item.question === "string")) {
            throw new Error("db.json must contain a non-empty questions array with question text.");
          }
          questionData = shuffleArray(data.questions);
          renderGrid(questionData);
          loadStatus.hidden = true;
        } catch (error) {
          console.error("Failed to load challenges:", error);
          showLoadError("We couldn’t load the challenges. Please try again in a moment.", true);
        }
      }

      retryLoad.onclick = loadQuestions;
      loadQuestions();

      function shuffleArray(array) {
        return array.sort(() => Math.random() - 0.5);
      }

      function renderGrid(questions) {
        for (let i = 1; i <= questions.length; i++) {
          const btn = document.createElement("button");
          btn.className = "question-btn";
          btn.textContent = i;
          btn.dataset.index = i - 1;
          btn.onclick = () => handleQuestionClick(btn);
          grid.appendChild(btn);
        }
      }

      function handleQuestionClick(btn) {
        const index = btn.dataset.index;
        if (usedNumbers.has(index)) return;

        usedNumbers.add(index);
        btn.disabled = true;

        const question = questionData[index];
        questionNumberEl.textContent = +index + 1;
        questionText.textContent = question.question;

        // Show the preloader before showing the question
        showPreloader(() => {
          grid.style.display = "none";
          questionBox.style.display = "block";

          startCountdown(180, () => {
            passBtn.style.display = "inline-block";
          });
        });
      }

      function startCountdown(duration, callback) {
        clearInterval(timer);
        let time = duration;
        countdown.textContent = time;
        timer = setInterval(() => {
          time--;
          countdown.textContent = time;
          if (time <= 0) {
            clearInterval(timer);
            if (callback) callback();
          }
        }, 1000);
      }

      function showPreloader(callback) {
        const preloader = document.getElementById("preloader");
        const preloaderCount = document.getElementById("preloader-count");
        let count = 3;

        preloader.style.display = "flex";
        preloaderCount.textContent = count;

        const interval = setInterval(() => {
          count--;
          if (count === 0) {
            clearInterval(interval);
            preloader.style.display = "none";
            callback(); // Show question box
          } else {
            preloaderCount.textContent = count;
          }
        }, 1000);
      }

      function showWinnerAlert(groupName) {
        Swal.fire({
          title: `🎉 ${groupName} Wins!`,
          text: `Congratulations! ${groupName} reached the winning score!`,
          icon: "success",
          timer: 280000, // 3 minutes
          timerProgressBar: true,
          allowOutsideClick: false,
          allowEscapeKey: false,
          showConfirmButton: false,
          background: "#fffaf0",
          customClass: {
            popup: "animated tada",
          },
          didOpen: () => {
            const content = Swal.getHtmlContainer();
            if (content) {
              content.style.fontFamily = "'Comic Sans MS', 'Poppins', cursive";
              content.style.fontSize = "1.3rem";
              content.style.color = "#333";
            }
          },
        });
      }

      passBtn.onclick = () => {
        passBtn.style.display = "none";
        startCountdown(20, () => {
          alert("Bonus round over. Switch to next question.");
          questionBox.style.display = "none";
          grid.style.display = "grid";
        });
      };

      backBtn.onclick = () => {
        questionBox.style.display = "none";
        grid.style.display = "grid";
        passBtn.style.display = "none";
      };
    </script>
  </body>
</html>
